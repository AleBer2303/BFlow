name: Build Unsigned iOS .ipa (iloader)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

concurrency:
  group: build-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  quality-gate:
    name: Pre-build Quality Gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --legacy-peer-deps
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test -- --coverage --ci

  build-unsigned-ipa:
    name: Compile Unsigned iOS .ipa on macOS
    needs: quality-gate
    runs-on: macos-26
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select Xcode 26+ (Swift 6.2+ required by Expo SDK 58)
        run: |
          ls -d /Applications/Xcode*.app
          XCODE_APP=$(ls -d /Applications/Xcode_26*.app /Applications/Xcode_27*.app 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -n "$XCODE_APP" ]; then
            echo "Switching to $XCODE_APP"
            sudo xcode-select -s "$XCODE_APP/Contents/Developer"
          fi
          xcodebuild -version
          swift --version

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install JS dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate native iOS project (Expo Prebuild)
        env:
          EXPO_NO_GIT_STATUS: 1
        run: npx expo prebuild --platform ios --clean --no-install

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: |
            ios/Pods
            ~/Library/Caches/CocoaPods
          key: ${{ runner.os }}-xcode26-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: |
            ${{ runner.os }}-xcode26-pods-

      - name: Install CocoaPods
        run: npx pod-install --non-interactive

      - name: Build unsigned Release .app for iOS device
        run: |
          xcodebuild build \
            -workspace ios/BFlow.xcworkspace \
            -scheme BFlow \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            COMPILER_INDEX_STORE_ENABLE=NO

      - name: Package Payload/ into BFlow-unsigned.ipa
        run: |
          mkdir -p build/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/BFlow.app build/Payload/
          cd build
          zip -qry BFlow-unsigned.ipa Payload
          ls -lh BFlow-unsigned.ipa

      - name: Upload BFlow-unsigned.ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BFlow-unsigned-ipa
          path: build/BFlow-unsigned.ipa
          retention-days: 30

      - name: Compute Release Tag and Title
        id: release_meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="build-${GITHUB_RUN_NUMBER}"
          fi
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "title=BFlow iOS Unsigned .ipa (${TAG})" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release (on main or version tag)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_meta.outputs.tag }}
          name: ${{ steps.release_meta.outputs.title }}
          generate_release_notes: true
          files: build/BFlow-unsigned.ipa
