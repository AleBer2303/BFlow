name: Maestro E2E Tests (iOS Simulator)

on:
  workflow_dispatch:
  schedule:
    - cron: '0 7 * * 1' # Weekly on Mondays at 02:00 America/Bogota

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  maestro-e2e:
    name: Run Maestro E2E Flows on iOS Simulator
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Verify Maestro flows directory
        run: |
          echo "Maestro E2E harness ready (full flows enabled in Phase 8)"
