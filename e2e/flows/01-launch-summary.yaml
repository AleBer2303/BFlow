# Arranque: la app abre con la sesión demo y muestra el Resumen del presupuesto de ejemplo.
appId: com.bflow.app
name: 01-launch-summary
tags:
  - smoke
  - demo
---
- runFlow: ../subflows/launch-demo.yaml

# No hay puerta de autenticación y el mes activo es el actual (el del presupuesto de ejemplo).
- assertNotVisible:
    id: auth-gate-screen
- assertVisible: '.*(Enero|Febrero|Marzo|Abril|Mayo|Junio|Julio|Agosto|Septiembre|Octubre|Noviembre|Diciembre) [0-9]{4}'
- assertVisible:
    id: workspace-tab-summary

# Tarjetas del Resumen.
- assertVisible:
    id: net-flow-hero-card
- assertVisible:
    id: golden-net-flow
- assertVisible:
    id: checklist-progress-badge
# Presupuesto de ejemplo (src/data/sample/sampleWorkspace.ts): 6 de 12 ítems completados.
- assertVisible: 'Checklist 6 de 12'
- assertVisible:
    id: income-summary-card
- assertVisible:
    id: expense-summary-card

# La curva del mes queda debajo de las tarjetas.
- scrollUntilVisible:
    element:
      id: monthly-curve-section
    direction: DOWN
- takeScreenshot: 01-launch-summary
